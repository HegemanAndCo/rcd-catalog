<head>

<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Gallery — The Right Ring</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
*::-webkit-scrollbar{display:none;}
body{background:#fff;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;scrollbar-width:none;}
.hdr{text-align:center;padding:48px 20px 32px;border-bottom:1px solid #e8e8e8;margin-bottom:32px;}
.hdr h1{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:400;font-style:italic;color:#1a1a1a;margin-bottom:12px;}
.hdr p{font-size:12px;font-weight:300;color:#888;letter-spacing:0.12em;line-height:1.9;text-transform:uppercase;}
.hdr-line{width:32px;height:1px;background:#1a1a1a;margin:18px auto 0;}
#loading{text-align:center;padding:80px 20px;color:#aaa;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;}
.spin{width:26px;height:26px;border:1px solid #e0e0e0;border-top-color:#1a1a1a;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
#grid-wrap{display:none;width:100%;padding:0 24px;}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-width:900px;margin:0 auto;}
@media(max-width:800px){#grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:500px){#grid{grid-template-columns:repeat(2,1fr);}}
.tile{cursor:pointer;overflow:hidden;position:relative;background:#f5f5f5;aspect-ratio:1;}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s,filter 0.3s;}
.tile:hover img{transform:scale(1.06);filter:brightness(0.8);}
.tile-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;background:linear-gradient(to top,rgba(0,0,0,0.5),transparent 55%);opacity:0;transition:opacity 0.3s;}
.tile:hover .tile-overlay{opacity:1;}
.tile-cta{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:#fff;border-bottom:1px solid rgba(255,255,255,0.5);padding-bottom:2px;}
#modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;}
#modal.open{display:flex;}
.m-inner{background:#fff;display:grid;grid-template-columns:1fr 1fr;max-width:800px;width:100%;position:relative;animation:up 0.3s ease;max-height:90vh;overflow-y:auto;}
@media(max-width:620px){.m-inner{grid-template-columns:1fr;}}
@keyframes up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.m-img{background:#f5f5f5;min-height:360px;}
.m-img img{width:100%;height:100%;object-fit:cover;display:block;}
.m-form{padding:40px 36px;display:flex;flex-direction:column;justify-content:center;}
